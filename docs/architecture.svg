<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
<title id="architecture-title">Fullhooker component map</title>
<desc id="architecture-desc">Product data persists in SQLite; job state remains in process memory.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { color: #2d3142; font-family: Geist,Arial,sans-serif; }
      #architecture-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#architecture-root .diagram-container { overflow-x:visible }
}</style><marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/></marker></defs>
<rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="48" font-family="Instrument Serif, Georgia, serif" font-size="28" fill="#2d3142">Fullhooker component map</text>
<text x="40" y="76" font-family="Geist, Arial, sans-serif" font-size="11" fill="#5a6580">Product data persists in SQLite; job state remains in process memory.</text>
<path d="M 264,192 H 352" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
<path d="M 576,192 H 688" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
<path d="M 800,232 V 392" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
<path d="M 736,232 V 296 Q 736,304 728,304 H 512 Q 504,304 504,312 V 392" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
<path d="M 416,232 V 392" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
<path d="M 376,232 V 328 Q 376,336 368,336 H 160 Q 152,336 152,344 V 392" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
<g data-node="Browser interface"><rect x="40" y="152" width="224" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.1"/>
<text x="56" y="170" fill="#4f5d75" font-family="Geist Mono, Consolas, monospace" font-size="8" letter-spacing="1">INPUT</text>
<text x="56" y="192" fill="#2d3142" font-family="Geist, Arial, sans-serif" font-weight="600" font-size="12">Browser interface</text>
<text x="56" y="210" fill="#5a6580" font-family="Geist Mono, Consolas, monospace" font-size="9">Upload / list / poll</text>
</g>
<g data-node="FastAPI"><rect x="352" y="152" width="224" height="80" rx="6" fill="#f2e7e2" stroke="#bf4520" stroke-width="1.8"/>
<text x="368" y="170" fill="#bf4520" font-family="Geist Mono, Consolas, monospace" font-size="8" letter-spacing="1">CORE</text>
<text x="368" y="192" fill="#2d3142" font-family="Geist, Arial, sans-serif" font-weight="600" font-size="12">FastAPI</text>
<text x="368" y="210" fill="#5a6580" font-family="Geist Mono, Consolas, monospace" font-size="9">Product and import routes</text>
</g>
<g data-node="Import thread"><rect x="688" y="152" width="224" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.1"/>
<text x="704" y="170" fill="#4f5d75" font-family="Geist Mono, Consolas, monospace" font-size="8" letter-spacing="1">WORKER</text>
<text x="704" y="192" fill="#2d3142" font-family="Geist, Arial, sans-serif" font-weight="600" font-size="12">Import thread</text>
<text x="704" y="210" fill="#5a6580" font-family="Geist Mono, Consolas, monospace" font-size="9">CSV rows / upsert by SKU</text>
</g>
<g data-node="Webhook manager"><rect x="40" y="392" width="224" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="56" y="410" fill="#4f5d75" font-family="Geist Mono, Consolas, monospace" font-size="8" letter-spacing="1">MOCK</text>
<text x="56" y="432" fill="#2d3142" font-family="Geist, Arial, sans-serif" font-weight="600" font-size="12">Webhook manager</text>
<text x="56" y="450" fill="#5a6580" font-family="Geist Mono, Consolas, monospace" font-size="9">Registration / mock result</text>
</g>
<g data-node="SQLite"><rect x="352" y="392" width="224" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.1"/>
<text x="368" y="410" fill="#4f5d75" font-family="Geist Mono, Consolas, monospace" font-size="8" letter-spacing="1">STORE</text>
<text x="368" y="432" fill="#2d3142" font-family="Geist, Arial, sans-serif" font-weight="600" font-size="12">SQLite</text>
<text x="368" y="450" fill="#5a6580" font-family="Geist Mono, Consolas, monospace" font-size="9">products.db</text>
</g>
<g data-node="Progress dictionary"><rect x="688" y="392" width="224" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.1"/>
<text x="704" y="410" fill="#4f5d75" font-family="Geist Mono, Consolas, monospace" font-size="8" letter-spacing="1">MEMORY</text>
<text x="704" y="432" fill="#2d3142" font-family="Geist, Arial, sans-serif" font-weight="600" font-size="12">Progress dictionary</text>
<text x="704" y="450" fill="#5a6580" font-family="Geist Mono, Consolas, monospace" font-size="9">job_id -&gt; percentage</text>
</g>
<line x1="40" y1="548" x2="920" y2="548" stroke="#4f5d75" stroke-width="0.7"/>
<text x="40" y="568" font-family="Geist, Arial, sans-serif" font-size="10" fill="#5a6580">Threads are not durable jobs. Webhook tests do not send an HTTP request.</text>
<text x="40" y="588" font-family="Geist Mono, Consolas, monospace" font-size="8" fill="#5a6580">ARROWS: DATA OR DEPENDENCY DIRECTION   /   DASHED BOX: EXTERNAL SERVICE OR MOCK   /   SOURCE: REPOSITORY FILES</text>
</svg>
